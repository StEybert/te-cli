name: Bug report
description: Report something that isn't working as expected in the Tabular Editor CLI.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

        The Tabular Editor CLI is in **Limited Public Preview** — commands, flags, and outputs may still change.

        **Before submitting, please:**
        1. Run `te --version` and make sure you are on the latest preview release from [tabulareditor.com](https://tabulareditor.com).
        2. Search [existing issues](../issues?q=is%3Aissue) to avoid duplicates — if you find a match, please comment there instead of opening a new one.

  - type: checkboxes
    id: prereqs
    attributes:
      label: Pre-flight checks
      options:
        - label: I am running the latest preview release of the Tabular Editor CLI.
          required: true
        - label: I have searched existing issues and could not find a duplicate.
          required: true

  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output of `te --version`.
      placeholder: "te 0.4.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other (please specify in description)
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
        - Other (please specify in description)
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command that triggered the bug
      description: Paste the exact command you ran. **Redact any secrets, tokens, or tenant IDs first.**
      render: shell
      placeholder: te deploy ./model -s my-workspace -d my-model --force
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include stderr/stdout output if relevant. Use `--debug` for extra diagnostic detail.
      render: shell
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal reproduction steps. A sample model (TMDL folder or .bim) is often helpful.
      placeholder: |
        1. `te load ./model`
        2. `te set Sales/Amount -q expression -i "SUM(Sales[Amt])" --save`
        3. Observe: ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help us diagnose — screenshots, relevant config (`te config show`), model format, auth method, etc.
    validations:
      required: false
